<style>.colors{transform-origin:680px 328px;animation:turn 20s ease-in-out infinite alternate}.one,.two,.three{animation:arrive 1.1s ease-out both}.two{animation-delay:.15s}.three{animation-delay:.3s}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes turn{from{transform:rotate(-20deg) scale(1.1)}to{transform:rotate(35deg) scale(1.18)}}@keyframes arrive{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.colors,.one,.two,.three,.pulse{animation:none}}</style>
