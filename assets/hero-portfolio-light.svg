<rect width="1280" height="640" fill="#e5e4e0"/>
<g fill="none" stroke="#1d1d1d" stroke-opacity=".12"><circle cx="680" cy="328" r="276"/><circle cx="680" cy="328" r="291" stroke-dasharray="2 4"/></g>
