<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc">
<title id="title">司马简霖 · AI 产品经理</title>
<desc id="desc">动态横幅：从问题出发，把 AI 做进真实场景。流程沿发现、构建与分享依次流动。</desc>

<style>
  .intro-a { animation: arrive .85s ease-out both; }
  .intro-b { animation: arrive .85s .22s ease-out both; }
  .intro-c { animation: arrive .85s .45s ease-out both; }
  .signal { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow-line { stroke-dasharray: 3 8; animation: stream 1.8s linear infinite; }
  .flow-dot { animation: travel 9s ease-in-out infinite; }
  .halo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 9s ease-out infinite; }
  .halo-2 { animation-delay: 3s; }
  .halo-3 { animation-delay: 6s; }
  .progress { animation: progress 9s linear infinite; }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes breathe { 0%,100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes stream { to { stroke-dashoffset: -22; } }
  @keyframes travel { 0%,8% { transform: translateY(0); opacity: 1; } 30%,40% { transform: translateY(85px); opacity: 1; } 63%,75% { transform: translateY(170px); opacity: 1; } 92% { transform: translateY(170px); opacity: 0; } 93% { transform: translateY(0); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes halo { 0% { opacity: .7; transform: scale(.88); } 23% { opacity: 0; transform: scale(1.48); } 24%,100% { opacity: 0; transform: scale(1.48); } }
  @keyframes progress { from { width: 0; } to { width: 144px; } }
  @media (prefers-reduced-motion: reduce) {
    .intro-a,.intro-b,.intro-c,.signal,.flow-line,.flow-dot,.halo,.progress { animation: none; }
    .intro-a,.intro-b,.intro-c,.signal { opacity: 1; transform: none; }
    .halo,.flow-dot { opacity: 0; }
    .progress { width: 144px; }
  }
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#385046"/></pattern></defs>
